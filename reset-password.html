<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | HS Foundation</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>New Password</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Choose a new password for your account.</p>
    </div>
    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn-full" id="resetBtn">Reset Password</button>
      <div id="resetMessage" style="font-size: 0.9rem; text-align: center; margin-top: 16px; display: none;"></div>
    </form>
  </div>
  <script src="assets/js/public-auth-api.js"></script>
  <script>
    const email = localStorage.getItem('reset_email');
    const otp = localStorage.getItem('reset_otp');
    if (!email || !otp) window.location.href = 'forgot-password.html';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('newPassword').value.trim();
      const confirm = document.getElementById('confirmPassword').value.trim();
      const msg = document.getElementById('resetMessage');
      if (password !== confirm) {
        msg.style.color = '#ef4444';
        msg.textContent = 'Passwords do not match.';
        msg.style.display = 'block';
        return;
      }
      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      try {
        const data = await publicAuthFetch('/reset-password', {
          method: 'POST',
          body: JSON.stringify({ email, otp, password }),
        });
        if (data.success) {
          localStorage.removeItem('reset_email');
          localStorage.removeItem('reset_otp');
          msg.style.color = '#2E946A';
          msg.textContent = 'Password updated! Redirecting to login…';
          msg.style.display = 'block';
          setTimeout(() => { window.location.href = 'admin_login.html'; }, 1500);
        } else {
          msg.style.color = '#ef4444';
          msg.textContent = data.message || 'Reset failed.';
          msg.style.display = 'block';
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.textContent = 'Server error.';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
