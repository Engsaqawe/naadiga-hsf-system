<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | HS Foundation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div style="margin-bottom: 16px;"><img src="portal/img/logo.svg" alt="Logo" style="height: 100px; border-radius: 50%;"></div>
      <h1>Forgot Password</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">Enter the email you used when registering. We will send a 6-digit OTP code.</p>
    </div>
    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn-full" id="forgotBtn">Send OTP Code</button>
      <div id="forgotMessage" style="font-size: 0.9rem; text-align: center; margin-top: 16px; display: none;"></div>
    </form>
    <div style="text-align: center; margin-top: 24px;">
      <a href="admin_login.html" style="color: var(--primary-green); font-weight: 700; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>
  <script src="assets/js/public-auth-api.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const btn = document.getElementById('forgotBtn');
      const msg = document.getElementById('forgotMessage');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.style.display = 'none';
      try {
        const data = await publicAuthFetch('/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email }),
        });
        if (data.success) {
          localStorage.setItem('reset_email', email);
          msg.style.color = '#2E946A';
          msg.textContent = 'OTP sent! Redirecting…';
          msg.style.display = 'block';
          setTimeout(() => { window.location.href = 'verify-otp.html'; }, 1200);
        } else {
          msg.style.color = '#ef4444';
          msg.textContent = data.message || 'Email not found.';
          msg.style.display = 'block';
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.textContent = 'Server error. Is the backend running?';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send OTP Code';
      }
    });
  </script>
</body>
</html>
