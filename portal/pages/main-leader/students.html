<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Management - HSF</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
     <link rel="stylesheet" href="./main_leader_responsive.css">
    <style>
      .member-section-title {
        margin: 0;
        padding: 1rem 1.5rem;
        font-size: 1rem;
        font-weight: 700;
        color: var(--primary);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-bottom: none;
      }
      .member-section-title--graduated {
        margin-top: 1.5rem;
        border-radius: 20px 20px 0 0;
      }
      .member-section-title--active {
        border-radius: 0;
      }
      .member-section-empty {
        text-align: center;
        padding: 1.5rem;
        color: var(--text-muted);
      }
      .member-dufcad-row td {
        background: var(--bg-surface-muted);
        font-size: 0.88rem;
        color: var(--text-main);
        padding: 0.65rem 1rem;
        border-top: 2px solid var(--border);
      }
      .member-dufcad-count {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.82rem;
      }
      .member-dufcad-context {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.82rem;
        margin-left: 0.35rem;
      }
      .edit-graduated-panel {
        grid-column: 1 / -1;
        padding: 1rem 1.25rem;
        border: 1px dashed var(--border);
        border-radius: 14px;
        background: var(--bg-surface-subtle);
      }
      .edit-works-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 0.75rem;
      }
      .edit-works-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      @media (max-width: 640px) {
        .edit-works-fields { grid-template-columns: 1fr; }
      }
      .member-employment-panel {
        margin-top: 1.25rem;
        padding: 1.25rem 1.5rem;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      }
      .member-employment-panel h4 {
        margin: 0 0 0.75rem;
        font-size: 0.95rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .member-employment-panel p {
        margin: 0.35rem 0;
        font-size: 0.9rem;
        color: var(--text-main);
      }
      .member-employment-panel strong {
        color: var(--text-muted);
        font-weight: 600;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <header class="top-navbar" id="top-navbar"></header>

        <div class="dashboard-content">
          <div
            class="table-header students-toolbar"
            style="
              background: var(--bg-card);
              padding: 1.5rem;
              border-radius: 20px 20px 0 0;
              border: 1px solid var(--border);
              border-bottom: none;
            "
          >
            <div class="portal-toolbar toolbar-filters-row students-toolbar-filters" style="border:none;padding:0;margin:0;background:transparent;">
              <select
                id="convocation-filter"
                class="search-input"
                style="width: auto; padding-left: 12px;"
              >
                <option value="All">All Convocations</option>
              </select>
            </div>
            <div class="students-toolbar-actions d-flex gap-2">
              <button class="btn btn-outline" id="add-conv-btn">
                <i class="fa-solid fa-layer-group"></i> New Convocation
              </button>
              <button class="btn btn-primary" id="add-member-btn">
                <i class="fa-solid fa-plus"></i> Add New Member
              </button>
            </div>
            <div class="search-wrapper students-toolbar-search" style="width:100%;max-width:100%;">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="student-search"
                class="search-input"
                placeholder="Search members..."
              />
            </div>
          </div>

          <h4 class="member-section-title member-section-title--active">Active Members</h4>
          <div class="card-table" style="border-radius: 0; overflow-x: auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Convocation</th>
                  <th>Role</th>
                  <th class="text-center">Missed</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="active-members-body"></tbody>
            </table>
          </div>

          <h4 class="member-section-title member-section-title--graduated">Graduated Members</h4>
          <div class="card-table" style="border-radius: 0 0 20px 20px; overflow-x: auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Convocation</th>
                  <th>Role</th>
                  <th class="text-center">Works</th>
                  <th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="graduated-members-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="../../assets/js/data.js?v=20260714e"></script>
    <script src="../../assets/js/components.js"></script>
    <script>
      // In-memory cache so modals don't need extra fetches
      let allStudents = [];
      let allConvocations = [];
      let allMeetings = [];
      let allAttendance = [];

      document.addEventListener("DOMContentLoaded", async () => {
        const cu = getCurrentUser();
        if (!cu.id) { window.location.href = "../../login.html"; return; }

        Components.init({
          role: cu.role,
          activePage: "students",
          title: "Member Management",
          userName: cu.name || "Admin",
          userRoleLabel: cu.role || "Main Leader",
        });

        const activeMembersBody = document.getElementById("active-members-body");
        const graduatedMembersBody = document.getElementById("graduated-members-body");
        const searchInput      = document.getElementById("student-search");
        const filterSelect     = document.getElementById("convocation-filter");
        const convSelectAdd    = document.getElementById("new-conv");
        const convSelectEdit   = document.getElementById("edit-conv");

        // Modals
        const detailModal    = document.getElementById("student-modal");
        const addMemberModal = document.getElementById("add-member-modal");
        const editMemberModal= document.getElementById("edit-member-modal");
        const addConvModal   = document.getElementById("add-conv-modal");

        // â”€â”€ Loaders â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        async function loadFilters() {
          allConvocations = await getConvocations();
          if (!allConvocations.length) {
            await sleepMs(1000);
            allConvocations = await getConvocations();
          }

        async function loadStudents() {
          let users = await getUsers();
          if (!users.length) {
            await sleepMs(1000);
            users = await getUsers();
          }
          const [meetings, att] = await Promise.all([
            getMeetings(),
            getAttendance()
          ]);
          allStudents = users;
          allMeetings = meetings;
          allAttendance = att;
          applyFilter();
        }

        let currentDetailStudentId = null;

        function mergeStudentRecord(student) {
          if (!student?.id) return;
          const idx = allStudents.findIndex((x) => x.id === student.id);
          if (idx >= 0) allStudents[idx] = { ...allStudents[idx], ...student };
          else allStudents.push(student);
        }

        function bodyCardDisplay(student) {
          if (student?.bodyCard !== 'Yes') return 'No';
          return student.cardNumber || 'Yes';
        }

        function isManageableMember(s) {
          if (!s || s.role === "Public User" || s.role === "Alnuur") return false;
          if (String(s?.id || '').startsWith('alnuur-')) return false;
          return true;
        }

        function applyFilter() {
          const q   = searchInput  ? searchInput.value.toLowerCase()  : "";
          const fv  = filterSelect ? filterSelect.value : "All";
          const filtered = allStudents.filter(s => {
            if (!isManageableMember(s)) return false;
            const matchSearch = s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q);
            const matchFilter = fv === "All" || (s.convocation && s.convocation.toLowerCase() === fv.toLowerCase());
            return matchSearch && matchFilter;
          });
          renderStudents(
            filtered.filter(s => !s.isGraduated),
            filtered.filter(s => s.isGraduated)
          );
        }

        function calculateMissed(s) {
          return getMeetingAttendanceStats(s, allMeetings, allAttendance).missed;
        }

        function memberActionButtons(s) {
          return `
            <div class="d-flex gap-1 justify-end">
              <button type="button" class="btn btn-outline" style="padding:6px 10px;" title="View" onclick="viewFullStudent('${s.id}')"><i class="fa-solid fa-eye"></i></button>
              <button type="button" class="btn btn-outline" style="padding:6px 10px;color:var(--secondary);" title="Edit" onclick="openEditModal('${s.id}')"><i class="fa-solid fa-pen-to-square"></i></button>
              <button type="button" class="btn btn-outline" style="padding:6px 10px;color:#dc2626;border-color:#fecaca;" title="Delete" onclick="deleteMember('${s.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>`;
        }

        function renderMemberRow(s, graduatedTable) {
          const profilePic = getProfilePicUrl(s);
          const nameCell = `
            <td>
              <div class="d-flex align-center gap-2">
                <img src="${profilePic}"
                     onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=1e4a6d&color=fff'"
                     style="width:32px;height:32px;border-radius:50%;object-fit:cover;" alt="">
                <span>${s.name}</span>
              </div>
            </td>`;
          if (graduatedTable) {

            return `
            <tr>
              <td><strong>${s.id}</strong></td>
              ${nameCell}

              <td><span class="badge ${roleBadgeClass(s.role)}">${displayRole(s.role)}</span></td>
              <td class="text-center">${worksLabel}</td>

              <td>${memberActionButtons(s)}</td>

        function convocationSortOrder(name) {
          const conv = (allConvocations || []).find(
            (c) => c.name && name && c.name.toLowerCase() === name.toLowerCase()
          );
          if (conv && conv.year) return conv.year;
          const m = String(name || "").match(/\d+/);
          return m ? parseInt(m[0], 10) : 9999;
        }

        function groupMembersByDufcad(list) {
          const groups = new Map();
          [...(list || [])]
            .sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" }))
            .forEach((s) => {
              const key = (s.convocation || "").trim() || "Unassigned";
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(s);
            });
          return [...groups.keys()]
            .sort((a, b) => {
              if (a === "Unassigned") return 1;
              if (b === "Unassigned") return -1;
              const diff = convocationSortOrder(a) - convocationSortOrder(b);
              return diff || a.localeCompare(b);
            })
            .map((name) => ({ name, members: groups.get(name) }));
        }

        function renderGroupedMemberRows(list, graduatedTable) {
          const groups = groupMembersByDufcad(list);
          if (!groups.length) return "";
          return groups
            .map(
              (g) => `
            <tr class="member-dufcad-row">
              <td colspan="6">
                <strong>${g.name}</strong>
                <span class="${graduatedTable ? "member-dufcad-context" : "member-dufcad-count"}">${
                  graduatedTable
                    ? `(graduated · ${g.members.length} member${g.members.length === 1 ? "" : "s"})`
                    : `(${g.members.length} member${g.members.length === 1 ? "" : "s"})`
                }</span>
              </td>
            </tr>
            ${g.members.map((s) => renderMemberRow(s, graduatedTable)).join("")}
          `
            )
            .join("");
        }

        function renderStudents(activeList, graduatedList) {
          if (activeMembersBody) {
            activeMembersBody.innerHTML = activeList?.length
              ? renderGroupedMemberRows(activeList, false)
              : '<tr><td colspan="6" class="member-section-empty">No active members found.</td></tr>';
          }
          if (graduatedMembersBody) {
            graduatedMembersBody.innerHTML = graduatedList?.length
              ? renderGroupedMemberRows(graduatedList, true)
              : '<tr><td colspan="6" class="member-section-empty">No graduated members yet.</td></tr>';
          }
        }

        function formatWorkDate(val) {
          if (!val) return "";
          const d = new Date(`${val}T12:00:00`);
          if (Number.isNaN(d.getTime())) return val;
          return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
        }

        function convocationRecord(name) {
          return (allConvocations || []).find(
            (c) => c.name && name && c.name.toLowerCase() === name.toLowerCase()
          );
        }

        function validateMemberConvocationStatus(isGraduated, convName) {
          const conv = convocationRecord(convName);
          if (!conv) return "";
          if (isGraduated && !conv.isGraduated) {
            return "Graduated members must use a graduated dufcad, or set Member Status to Active.";
          }
          if (!isGraduated && conv.isGraduated) {
            return "Active members cannot be assigned to a graduated dufcad.";
          }
          return "";
        }

        function populateEditConvocationOptions(s) {
          if (!convSelectEdit) return;
          const isGraduatedMember =
            document.getElementById("edit-member-status")?.value === "graduated";
          const currentConv =
            document.getElementById("edit-conv")?.value || s?.convocation || "";
          let editOpts;
          if (isGraduatedMember) {
            editOpts = allConvocations.filter((c) => c.isGraduated);
            const curRec = convocationRecord(currentConv);
            if (
              currentConv &&
              (!curRec || !curRec.isGraduated) &&
              !editOpts.some((c) => c.name === currentConv)
            ) {
              editOpts.unshift({
                name: currentConv,
                isGraduated: false,
                invalidMix: true,
              });
            }
          } else {
            editOpts = allConvocations.filter((c) => !c.isGraduated);
          }
          if (!editOpts.length) {
            convSelectEdit.innerHTML =
              '<option value="" disabled selected>No matching convocations</option>';
            return;
          }
          convSelectEdit.innerHTML = editOpts
            .map((c) => {
              let suffix = "";
              if (c.invalidMix) {
                suffix = " (invalid — set Active or pick graduated dufcad)";
              } else if (c.isGraduated) {
                suffix = " (Graduated batch)";
              }
              return `<option value="${c.name}">${c.name}${suffix}</option>`;
            })
            .join("");
          if (editOpts.some((c) => c.name === currentConv)) {
            convSelectEdit.value = currentConv;
          } else {
            convSelectEdit.value = editOpts[0].name;
          }
        }

        document.getElementById("edit-member-form").onsubmit = async (e) => {

          if (!loginId) {
            Components.showToast("ID / Username is required.", "error");
            return;
          }

          const bodyCard = document.getElementById("edit-bodycard").value;
          const cardNumber = document.getElementById("edit-card-number").value.trim();
          const email = document.getElementById("edit-email").value.trim();
          if (!email) {
            Components.showToast("Email is required so the member can receive update notifications.", "error");
            return;
          }
          if (bodyCard === "Yes" && !cardNumber) {
            Components.showToast("Card number is required when Body Card is Yes.", "error");
            return;
          }

          const isGraduated = document.getElementById("edit-member-status").value === "graduated";
          const statusErr = validateMemberConvocationStatus(isGraduated, conv);
          if (statusErr) {
            Components.showToast(statusErr, "error");
            return;
          }

          const updatedData = {
            name:        document.getElementById("edit-name").value.trim(),
            username:    loginId,
            convocation: conv,
            role:        role,
            university:  document.getElementById("edit-university").value.trim(),
            faculty:     document.getElementById("edit-faculty").value.trim(),
            email:       document.getElementById("edit-email").value.trim(),
            phone:       document.getElementById("edit-phone").value.trim(),
            bodyCard,
            cardNumber: bodyCard === "Yes" ? cardNumber : "",
            isGraduated: isGraduated,
          };
          if (!isGraduated) {
            updatedData.semester = document.getElementById("edit-semester").value.trim();
          }
          if (isGraduated) {
            const hasWorks = document.getElementById("edit-has-works").checked;
            updatedData.hasWorks = hasWorks;
            if (hasWorks) {
              updatedData.workPlace = document.getElementById("edit-work-place").value.trim();
              updatedData.workRole = document.getElementById("edit-work-role").value.trim();
              updatedData.workStarted = document.getElementById("edit-work-started").value;
            }
          }
          const pass = document.getElementById("edit-password").value.trim();
          if (pass) updatedData.password = pass;

          const res = await editStudent(originalId, updatedData);
          if (res && res.success) {
            if (res.user) mergeStudentRecord(res.user);
            editMemberModal.classList.remove("active");
            await loadStudents();
            await viewFullStudent(originalId);
            if (res.emailSent) {
              Components.showToast("Member updated — notification email sent.", "success");
            } else {
              Components.showToast("Member updated successfully.", "success");
            }
          } else {
            Components.showToast(res?.error || "Error updating member.", "error");
          }
        };

        // â”€â”€ Add Convocation Form â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        document.getElementById("add-conv-form").onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("new-conv-name").value.trim();
          if (name) {
            await addConvocation(name, new Date().getFullYear());
            await loadFilters();
            addConvModal.classList.remove("active");
            document.getElementById("new-conv-name").value = "";
            alert("Convocation Added!");
          }
        };

        // â”€â”€ Initial Load â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        await loadFilters();
        await loadStudents();
        onPortalTabVisible(async () => {
          await loadFilters();
          await loadStudents();
        });
      });
    </script>
  </body>
</html>
