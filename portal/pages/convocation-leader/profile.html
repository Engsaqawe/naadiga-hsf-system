<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Profile - HSF</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../main-leader/main_leader_responsive.css" />
    <style>
      input[type="month"] {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 12px;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--text-main);
        height: 38px;
        outline: none;
        cursor: pointer;
      }

      input[type="month"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: grayscale(100%) opacity(0.5);
      }



  /* ========================= */
/* ENABLE SCROLL FOR PROFILE TABLE */
/* ========================= */

.table-wrapper1 {
  width: 100%;
  overflow-x: auto;   /* 🔥 enable scroll */
}
  @media (max-width: 768px) {

  .table-wrapper1 .data-table {
    min-width: 500px;   /* enough for 3 columns */
    width: max-content; /* 🔥 allows scrolling */
    overflow-x: scroll;
  }

}
</style>

  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <header class="top-navbar" id="top-navbar"></header>

        <div class="dashboard-content">
          <div class="d-flex align-center gap-3 mb-4">
            <label style="font-weight: 600; color: var(--text-muted)"><i
                class="fa-solid fa-calendar-days"></i> Select Month:</label>
            <input
              type="month"
              id="month-picker"
              class="search-input"
              style="width: auto" />
          </div>

          <div class="profile-card">
            <img
              id="student-profile-pic"
              src
              class="profile-img"
              alt="Profile" />

            <div class="profile-info">
              <h2 id="student-display-name" class="profile-name"></h2>

              <div class="profile-meta">
                <span><i class="fa-solid fa-hashtag"></i>
                  <span id="student-display-id"></span></span>
                <span><i class="fa-solid fa-users"></i>
                  <span id="student-display-conv"></span></span>
              </div>

              <div class="profile-status">
                <span id="student-payment-badge" class="badge"></span>
              </div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon icon-blue">
                <i class="fa-solid fa-calendar-check"></i>
              </div>
              <div class="stat-info">
                <h4 id="attended-meetings">0</h4>
                <p>Meetings Attended</p>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon icon-red">
                <i class="fa-solid fa-calendar-xmark"></i>
              </div>
              <div class="stat-info">
                <h4 id="missed-meetings">0</h4>
                <p>Meetings Missed</p>
              </div>
            </div>
            <div id="unpaid-months-container"></div>
          </div>

          <div class="card-table" style="margin-top: 2rem">
            <div class="table-header">
              <h3 id="table-month-title">My Personal Records</h3>

              <div class="table-wrapper1">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Category</th>
                      <th>Date</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="payment-history-body">
                    <!-- Injected via JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- Scripts -->
      <script src="../../assets/js/data.js"></script>
      <script src="../../assets/js/components.js"></script>
      <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const currentUser = getCurrentUser();
        if (!currentUser.id) {
          window.location.href = "../../login.html";
          return;
        }

        const user = await getUserById(currentUser.id);
        if (!isValidUserRecord(user)) {
          localStorage.removeItem("hsf_current_user");
          window.location.href = "../../login.html";
          return;
        }

        Components.init({
          role: currentUser.role,
          activePage: "profile",
          title: "My Profile",
          userName: user.name,
          userRoleLabel: user.role,
        });

        document.getElementById("student-profile-pic").src = getProfilePicUrl(user);
        document.getElementById("student-display-name").innerText = user.name;
        document.getElementById("student-display-id").innerText = user.id;
        document.getElementById("student-display-conv").innerText =
          user.convocation;

        const monthPicker = document.getElementById("month-picker");

      let showAllMeetings = false;

      async function updateDashboard() {
        const dateVal = monthPicker.value;
        let selectedYear = '';
        let selectedMonthNum = '';
        let selectedMonthName = 'All Time';

        if (dateVal) {
            const [y, m] = dateVal.split('-');
            selectedYear = y;
            selectedMonthNum = m;
            const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
            selectedMonthName = months[parseInt(selectedMonthNum) - 1];
        }

        const [meetings, transactions, attendance] = await Promise.all([
          getMeetings(),
          getTransactions({ 
              student_id: user.id, 
              month: dateVal ? selectedMonthName : undefined, 
              year: dateVal ? selectedYear : undefined 
          }),
          getAttendance({ student_id: user.id }),
        ]);

        const pBadge = document.getElementById("student-payment-badge");
        if (dateVal) {
            const isPaid = transactions && transactions.length > 0;
            pBadge.innerText = isPaid ? `${selectedMonthName} Paid` : `${selectedMonthName} Unpaid`;
            pBadge.className = "badge " + (isPaid ? "badge-paid" : "badge-unpaid");
            pBadge.style.display = 'inline-block';
        } else {
            pBadge.style.display = 'none';
        }

        const studentCreatedDate = user.created_at ? new Date(user.created_at) : new Date(0);
        studentCreatedDate.setHours(0, 0, 0, 0);

        // TABLE: finalized + upcoming scheduled | STATS: finalized attendance only
        const allRelevantMeetings = meetings.filter(m =>
            typeof meetingDashboardAppliesToStudent === 'function'
            && meetingDashboardAppliesToStudent(m, user, attendance)
        );

        const statsMeetings = meetings.filter(m =>
            typeof meetingAppliesToStudent === 'function'
            && meetingAppliesToStudent(m, user, attendance)
        );

        let displayStatsMeetings = statsMeetings;
        if (dateVal) {
            displayStatsMeetings = statsMeetings.filter(m => {
                const [mYear, mMonth] = m.date.split("-");
                return mYear === selectedYear && mMonth === selectedMonthNum;
            });
        }

        let totalAttended = 0;
        let totalMissed = 0;
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        displayStatsMeetings.forEach(m => {
          const meetingDate = new Date(m.date);
          meetingDate.setHours(0, 0, 0, 0);
          
          const record = attendance.find(a => a.meeting_id === m.id);
          
          if (record && record.status === 'Present') {
              totalAttended++;
          } else if (meetingDate <= today) {
              totalMissed++;
          }
        });

        document.getElementById("attended-meetings").innerText = totalAttended;
        document.getElementById("missed-meetings").innerText = totalMissed;

        // RENDER TABLE
        let tableMeetings = allRelevantMeetings;
        if (dateVal && !showAllMeetings) {
            tableMeetings = allRelevantMeetings.filter(m => {
                const [mYear, mMonth] = m.date.split("-");
                return mYear === selectedYear && mMonth === selectedMonthNum;
            });
        }

        tableMeetings.sort((a, b) => new Date(b.date) - new Date(a.date));

        const limit = 5;
        const displayMeetings = showAllMeetings ? tableMeetings : tableMeetings.slice(0, limit);

        let meetingRows = displayMeetings.map(m => {
          const record = attendance.find(a => a.meeting_id === m.id);
          const present = record && (record.status === 'Present' || record.status === 'Late');
          const isExcused = record && record.is_excused && !present;
          const isFuture = new Date(m.date) > new Date();
          return `
              <tr>
                  <td><strong>Meeting:</strong> ${m.topic}</td>
                  <td>${m.date}</td>
                  <td><span class="badge ${isFuture ? 'badge-student' : (present ? 'badge-paid' : (isExcused ? 'badge-student' : 'badge-unpaid'))}">${isFuture ? 'Scheduled' : (present ? 'Present' : (isExcused ? 'Absent (excused)' : 'Absent'))}</span></td>
              </tr>
          `;
        }).join('');

        const hasMore = tableMeetings.length > displayMeetings.length;
        const loadMoreRow = (hasMore && !showAllMeetings) ? `
          <tr>
              <td colspan="3" style="text-align:center; padding: 1.5rem;">
                  <button class="btn btn-outline btn-sm" onclick="expandMeetings()">
                      <i class="fa-solid fa-chevron-down"></i> Show More
                  </button>
              </td>
          </tr>
        ` : '';

        document.getElementById("table-month-title").innerText = dateVal 
            ? (showAllMeetings ? `All Records (${selectedMonthName} Filtered)` : `${selectedMonthName} ${selectedYear} Status`)
            : `All-Time Meeting History`;

        const historyBody = document.getElementById("payment-history-body");
        historyBody.innerHTML = `
              ${dateVal ? `
              <tr style="background: var(--bg-hover);">
                  <td><strong>Monthly Fee (${selectedMonthName} ${selectedYear})</strong></td>
                  <td>-</td>
                  <td><span class="badge ${transactions.length > 0 ? "badge-paid" : "badge-unpaid"}">${transactions.length > 0 ? "Paid" : "Unpaid"}</span></td>
              </tr>` : ''}
              ${meetingRows}
              ${loadMoreRow}
          `;

          // Render Unpaid Months Box if any
          const unpaidContainer = document.getElementById("unpaid-months-container");
          if (unpaidContainer) {
            if (user.unpaidMonths && user.unpaidMonths.length > 0) {
              unpaidContainer.innerHTML = `
                <div class="stat-card" style="overflow: visible;">
                    <div class="stat-icon icon-orange">
                        <i class="fa-solid fa-money-bill-wave"></i>
                    </div>
                    <div class="stat-info" style="overflow: visible;">
                        <div class="hsf-tooltip">
                            <h4 style="margin: 0; display: inline-flex; align-items: center; gap: 6px;">
                                ${user.unpaidMonths.length}
                                <i class="fa-solid fa-eye" style="font-size: 0.95rem; color: var(--text-muted); cursor: pointer;"></i>
                            </h4>
                            <span class="tooltip-text">${user.unpaidMonths.join('<br>')}</span>
                        </div>
                        <p>Unpaid Months</p>
                    </div>
                </div>
              `;
            } else {
              unpaidContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon icon-green">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div class="stat-info">
                        <h4>0</h4>
                        <p>Unpaid Months</p>
                    </div>
                </div>
              `;
            }
          }
      }

      window.expandMeetings = () => {
        showAllMeetings = true;
        updateDashboard();
      };

      // Initialize without default to show All Time
      monthPicker.value = "";
      monthPicker.onchange = () => {
          showAllMeetings = false;
          updateDashboard();
      };
      await updateDashboard();
      });
    </script>
    </body>
  </html>
