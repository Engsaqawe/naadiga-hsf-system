<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HSF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=20260630">
    <script>
      try {
        var t = localStorage.getItem('portal-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-main); padding: 20px; }
        .auth-card { background: var(--bg-card); padding: 40px; border-radius: 30px; box-shadow: var(--shadow-lg); width: 100%; max-width: 450px; text-align: center; }
    </style>
</head>
<body class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-logo"><img src="img/logo.svg" alt="Logo"></div>
        <h2>Create New Password</h2>
        <p style="color: var(--text-muted); margin-bottom:2rem;">Your new password must be different from previous ones.</p>
        
        <form id="reset-form">
            <div class="form-group mb-4" style="text-align: left;">
                <label class="floating-label">New Password</label>
                <div class="input-container">
                    <input type="password" id="new-password" class="modern-input" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="show-pass-1" style="cursor: pointer;" onclick="const p = document.getElementById('new-password'); p.type = this.checked ? 'text' : 'password'">
                    <label for="show-pass-1" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; font-weight: 500">Show Password</label>
                </div>
                <div class="strength-meter">
                    <div id="strength-bar" class="strength-bar"></div>
                </div>
                <p id="strength-text" class="strength-text"></p>
            </div>

            <div class="form-group mb-4" style="text-align: left;">
                <label class="floating-label">Confirm Password</label>
                <div class="input-container">
                    <input type="password" id="confirm-password" class="modern-input" placeholder="••••••••" required>
                    <i class="fa-solid fa-check-double"></i>
                </div>
                <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="show-pass-2" style="cursor: pointer;" onclick="const p = document.getElementById('confirm-password'); p.type = this.checked ? 'text' : 'password'">
                    <label for="show-pass-2" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; font-weight: 500">Show Password</label>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="btn-modern primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-shield-circle-check"></i> Reset Password
            </button>
        </form>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>
    <script>
        const email = localStorage.getItem('reset_email');
        const otp = localStorage.getItem('reset_otp');
        if (!email || !otp) window.location.href = 'forgot-password.html';



        const newPassInput = document.getElementById('new-password');
        newPassInput.addEventListener('input', () => {
            const val = newPassInput.value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            let score = 0;
            if (val.length >= 8) score++;
            if (val.match(/[A-Z]/)) score++;
            if (val.match(/[0-9]/)) score++;
            if (val.match(/[^A-Za-z0-9]/)) score++;

            const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];
            
            if (val.length === 0) {
                bar.style.width = '0%';
                text.innerText = '';
            } else {
                bar.style.width = (score) * 25 + '%';
                bar.style.background = colors[score-1] || colors[0];
                text.innerText = labels[score-1] || labels[0];
                text.style.color = colors[score-1] || colors[0];
            }
        });

        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            if (password !== confirm) {
                Components.showToast('Passwords do not match!', 'error');
                return;
            }

            if (password.length < 8) {
                Components.showToast('Password must be at least 8 characters!', 'error');
                return;
            }

            Components.setLoading(btn, true);
            try {
                const res = await apiFetch('/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ email, otp, password })
                });

                if (res && res.success) {
                    Components.showToast('Success! Password updated.', 'success');
                    localStorage.removeItem('reset_email');
                    localStorage.removeItem('reset_otp');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    Components.showToast(res?.message || 'Reset failed', 'error');
                }
            } catch (err) {
                Components.showToast('Update failed', 'error');
            } finally {
                Components.setLoading(btn, false);
            }
        };
    </script>
</body>
</html>
