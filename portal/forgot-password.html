<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HSF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=20260630">
    <script>
      try {
        var t = localStorage.getItem('portal-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-main); padding: 20px; }
        .auth-card { background: var(--bg-card); padding: 40px; border-radius: 30px; box-shadow: var(--shadow-lg); width: 100%; max-width: 450px; text-align: center; }
        .auth-logo { font-size: 3rem; color: var(--primary); margin-bottom: 20px; }
    </style>
</head>
<body class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-logo"><img src="img/logo.svg" alt="Logo"></div>
        <h2>Forgot Password?</h2>
        <p class="mb-4" style="color: var(--text-muted);">Enter your email to receive a 6-digit OTP code.</p>
        
        <form id="forgot-form">
            <div class="form-group mb-4" style="text-align: left;">
                <label class="floating-label">Email Address</label>
                <div class="input-container">
                    <input type="email" id="email" class="modern-input" placeholder="example@gmail.com" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="btn-modern primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-paper-plane"></i> Send OTP Code
            </button>
            
            <div class="mt-4" style="margin-top: 1.5rem;">
                <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </form>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>
    <script>
        document.getElementById('forgot-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submit-btn');

            Components.setLoading(btn, true);
            
            try {
                const res = await apiFetch('/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });

                if (res && res.success) {
                    Components.showToast('OTP sent successfully!', 'success');
                    localStorage.setItem('reset_email', email);
                    setTimeout(() => window.location.href = 'verify-otp.html', 1500);
                } else {
                    Components.showToast(res?.message || 'Email not found', 'error');
                }
            } catch (err) {
                Components.showToast('Server error', 'error');
            } finally {
                Components.setLoading(btn, false);
            }
        };
    </script>
</body>
</html>
